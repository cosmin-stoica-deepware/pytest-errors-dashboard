<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test Health Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --panel: #12151c;
    --border: #232733;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --red: #ef5f6a;
    --green: #4fd18b;
    --yellow: #e8b94e;
    --accent: #6ea8fe;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #e2e5ea;
      --text: #1b1f27;
      --muted: #6b7280;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 4px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
  th:hover { color: var(--text); }
  td.test-name { white-space: normal; max-width: 420px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.passed { background: rgba(79,209,139,0.15); color: var(--green); }
  .badge.failed, .badge.error { background: rgba(239,95,106,0.15); color: var(--red); }
  .badge.skipped { background: rgba(232,185,78,0.15); color: var(--yellow); }
  .badge.unknown { background: rgba(139,147,167,0.15); color: var(--muted); }
  .failrate-bar { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; vertical-align: middle; margin-right: 8px; }
  .failrate-bar > div { height: 100%; background: var(--red); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 13px;
  }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .refresh { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <h1>Test Health Dashboard</h1>
  <div class="sub">Storico dei fallimenti pytest riportati dalla pipeline Jenkins &middot; <span id="lastUpdated" class="refresh"></span></div>

  <div class="cards" id="cards"></div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Filtra per nome test..." />
    <select id="categoryFilter">
      <option value="">Tutte le categorie</option>
    </select>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th data-key="test_name">Test</th>
          <th data-key="fail_rate">Fail rate</th>
          <th data-key="total">Run</th>
          <th data-key="failed">Falliti</th>
          <th data-key="last_outcome">Ultimo esito</th>
          <th data-key="last_build">Ultima build</th>
          <th data-key="category">Categoria</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">Nessun dato ancora. Configura Jenkins per inviare i risultati a <code>/api/results</code>.</div>
  </div>

<script>
  let allTests = [];
  let sortKey = 'fail_rate';
  let sortDir = -1;

  function topCategory(cats) {
    const entries = Object.entries(cats || {});
    if (entries.length === 0) return null;
    entries.sort((a, b) => b[1] - a[1]);
    return entries[0][0];
  }

  function render() {
    const search = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('categoryFilter').value;

    let filtered = allTests.filter((t) => {
      if (search && !t.test_name.toLowerCase().includes(search)) return false;
      if (cat && topCategory(t.categories) !== cat) return false;
      return true;
    });

    filtered.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string') return sortDir * av.localeCompare(bv || '');
      return sortDir * ((av || 0) - (bv || 0));
    });

    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';

    for (const t of filtered) {
      const tr = document.createElement('tr');
      const pct = Math.round(t.fail_rate * 100);
      const buildLink = t.last_build_url
        ? `<a href="${t.last_build_url}" target="_blank" rel="noopener">#${t.last_build || '?'}</a>`
        : (t.last_build ? `#${t.last_build}` : '-');
      tr.innerHTML = `
        <td class="test-name">${t.test_name}</td>
        <td><span class="failrate-bar"><div style="width:${pct}%"></div></span>${pct}%</td>
        <td>${t.total}</td>
        <td>${t.failed + t.error}</td>
        <td><span class="badge ${t.last_outcome}">${t.last_outcome || '-'}</span></td>
        <td>${buildLink}</td>
        <td>${topCategory(t.categories) || '-'}</td>
      `;
      rows.appendChild(tr);
    }
  }

  function renderCards(data) {
    const tests = data.tests || [];
    const flaky = tests.filter((t) => t.fail_rate > 0 && t.fail_rate < 1).length;
    const currentlyFailing = tests.filter((t) => t.last_outcome === 'failed' || t.last_outcome === 'error').length;
    const cards = [
      { label: 'Test monitorati', value: tests.length },
      { label: 'Run registrate', value: data.total_entries },
      { label: 'Test flaky', value: flaky },
      { label: 'In fallimento ora', value: currentlyFailing },
    ];
    document.getElementById('cards').innerHTML = cards
      .map((c) => `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`)
      .join('');
  }

  function populateCategories(tests) {
    const set = new Set();
    tests.forEach((t) => {
      const c = topCategory(t.categories);
      if (c) set.add(c);
    });
    const sel = document.getElementById('categoryFilter');
    const current = sel.value;
    sel.innerHTML = '<option value="">Tutte le categorie</option>' +
      Array.from(set).sort().map((c) => `<option value="${c}">${c}</option>`).join('');
    sel.value = current;
  }

  async function load() {
    try {
      const res = await fetch('/api/results?limit=3000');
      const data = await res.json();
      allTests = data.tests || [];
      renderCards(data);
      populateCategories(allTests);
      render();
      document.getElementById('lastUpdated').textContent =
        'aggiornato alle ' + new Date(data.generated_at).toLocaleTimeString('it-IT');
    } catch (e) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('emptyState').textContent = 'Errore nel caricamento: ' + e.message;
    }
  }

  document.querySelectorAll('th[data-key]').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
      render();
    });
  });
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('categoryFilter').addEventListener('change', render);

  load();
  setInterval(load, 60000);
</script>
</body>
</html>
